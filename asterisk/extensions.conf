; Dialplan OTPBridge — chamadas de voz entrantes
; Instalar/incluir em: /etc/asterisk/extensions.conf
;
; Fluxo:
;   1. Atende a chamada
;   2. Aguarda 1s para estabilizar o áudio
;   3. Grava até 30s (encerra com 3s de silêncio)
;   4. Chama o AGI que repassa o WAV ao OTPBridge via HTTP
;   5. Desliga
;
; O AGI (otpbridge_agi.py) deve estar em /var/lib/asterisk/agi-bin/
; com permissão de execução:
;   cp modems/asterisk_agi.py /var/lib/asterisk/agi-bin/otpbridge_agi.py
;   chmod +x /var/lib/asterisk/agi-bin/otpbridge_agi.py

; ─────────────────────────────────────────────────────────────────────────────
; E303 via chan_dongle
; Contexto definido em dongle.conf (context=otpbridge-dongle)
;
; DONGLE_NUMBER deve ser configurado como CallerID do dongle (número do SIM).
; Se não estiver disponível, substitua ${DONGLE_NUMBER} pelo número fixo
; ou use uma variável de canal personalizada.
; ─────────────────────────────────────────────────────────────────────────────
[otpbridge-dongle]
; SMS entrante
exten => sms,1,NoOp(SMS dongle=${DONGLENAME} de=${CALLERID(num)})
 same => n,AGI(otpbridge_sms_agi.py,${DONGLENAME},${CALLERID(num)},${BASE64_DECODE(${SMS_BASE64})})
 same => n,Hangup()

; Chamada de voz entrante
exten => s,1,NoOp(Chamada entrante E303 — dongle: ${DONGLENAME})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(WAVFILE=/tmp/otp_${DONGLENAME}_${EPOCH}.wav)
 same => n,Record(${WAVFILE},3,30,q)
 same => n,AGI(otpbridge_agi.py,${CALLERID(dnid)},${WAVFILE})
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────────────────────
; GoIP — canal SIP registrado no Asterisk
; O ramal discado (EXTEN) é o número do SIM no GoIP.
; Configurar o GoIP para registrar no Asterisk com user=goip-lineN.
; ─────────────────────────────────────────────────────────────────────────────
[otpbridge-goip]
exten => _X.,1,NoOp(Chamada entrante GoIP — número: ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(WAVFILE=/tmp/otp_goip_${EXTEN}_${EPOCH}.wav)
 same => n,Record(${WAVFILE},3,30,q)
 same => n,AGI(otpbridge_agi.py,${EXTEN},${WAVFILE})
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────────────────────
; OpenVox — idêntico ao GoIP
; ─────────────────────────────────────────────────────────────────────────────
[otpbridge-openvox]
exten => _X.,1,NoOp(Chamada entrante OpenVox — número: ${EXTEN})
 same => n,Answer()
 same => n,Wait(1)
 same => n,Set(WAVFILE=/tmp/otp_openvox_${EXTEN}_${EPOCH}.wav)
 same => n,Record(${WAVFILE},3,30,q)
 same => n,AGI(otpbridge_agi.py,${EXTEN},${WAVFILE})
 same => n,Hangup()
