; chan_dongle — 16 modems Huawei E303
; Instalar em: /etc/asterisk/dongle.conf
;
; Cada modem usa a mesma porta para AT (data) e áudio (audio).
; O ModemManager deve ser desabilitado para estes dispositivos
; (ver setup: systemctl stop ModemManager && systemctl disable ModemManager)
;
; Após alterar, recarregar: asterisk -rx "module reload chan_dongle.so"
;
; Preencher number= com o número real do SIM (rodar tools/discover_numbers.py)

[general]
interval=15

; ── dongle0  (MM:16 → ttyUSB4) ───────────────────────────────────────────────
[dongle0]
audio=/dev/null  ; original: /dev/ttyUSB4
data=/dev/ttyUSB4
context=otpbridge-dongle
group=0
rxgain=3
txgain=3
autodeletesms=yes
resetdongle=yes
; number=55XXXXXXXXXXX

