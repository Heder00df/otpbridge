; chan_dongle — configuração dos modems Huawei E303
; Instalar em: /etc/asterisk/dongle.conf
; Documentação: https://github.com/bg111/asterisk-chan-dongle
;
; Para cada modem USB adicionar uma seção [dongleN].
; O ModemManager usa a porta AT (/dev/ttyUSB1); o chan_dongle usa
; a porta de dados/audio (/dev/ttyUSB0) — sem conflito.
;
; Descubra os dispositivos com:
;   ls /dev/ttyUSB*
;   mmcli -L

[general]
interval=15

; ── Modem 1 ──────────────────────────────────────────────────────────────────
[dongle0]
audio=/dev/ttyUSB0          ; porta de áudio (varia conforme modelo/ordem USB)
data=/dev/ttyUSB2           ; porta AT/dados
context=otpbridge-dongle    ; contexto do dialplan para chamadas entrantes
group=0
rxgain=3
txgain=3
autodeletesms=yes
resetdongle=yes
; callerid=<número do SIM>  ; opcional — Asterisk usa como CallerID de saída

; ── Modem 2 (se houver) ──────────────────────────────────────────────────────
; [dongle1]
; audio=/dev/ttyUSB3
; data=/dev/ttyUSB5
; context=otpbridge-dongle
; group=0
